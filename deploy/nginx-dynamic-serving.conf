# Nginx Dynamic Serving 配置（同 URL 根据 User-Agent 分发桌面端/移动端独立包 + Fish Audio CORS 代理）
# 请将 root 指向 Vite 构建生成的 dist 目录路径。

map $http_user_agent $ua_device_target {
    default "desktop";
    ~*(Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera\ Mini|Mobile|HarmonyOS|MicroMessenger|Windows\ Phone) "mobile";
}

map $cookie_tts_device_mode $effective_device {
    default   $ua_device_target;
    "desktop" "desktop";
    "mobile"  "mobile";
}

server {
    listen 80;
    server_name _;

    root /var/www/gemini-tts-studio/dist;
    index index.html;

    # 同 URL 动态分发入口（Desktop/Mobile 共用 /，响应头携带 Vary: User-Agent）
    location = / {
        add_header Vary "User-Agent, Cookie" always;
        add_header X-TTS-Served-Bundle $effective_device always;
        sub_filter '../assets/' './assets/';
        sub_filter_once off;
        try_files /$effective_device/index.html =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /desktop/ {
        try_files $uri $uri/ /desktop/index.html;
    }

    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    # Fish Audio CORS 反向代理（解决浏览器端 /v1/tts 预检跨域限制）
    location /api/fish/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, model, Accept, Accept-Language" always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass https://api.fish.audio/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.fish.audio;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, model, Accept, Accept-Language" always;
    }
}
